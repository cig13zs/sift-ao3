<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sift for AO3</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="top">
    <h1 id="title">Sift for AO3</h1>
    <label class="check" for="enabled"><input type="checkbox" id="enabled" role="switch" aria-labelledby="title"> On</label>
  </header>
  <dl class="counts" aria-label="Hidden works counts">
    <div><dt>Hidden on this page</dt><dd id="page">–</dd></div>
    <div><dt>Hidden in total</dt><dd id="total">0</dd></div>
  </dl>
  <p id="note" class="note" hidden role="status"></p>
  <p id="hint" class="hint" hidden></p>
  <p class="row">
    <button type="button" id="options">Options</button>
    <span class="hint" id="shortcut" title="Change in chrome://extensions/shortcuts">Alt+Shift+S toggles Sift</span>
  </p>
  <footer><a href="https://ko-fi.com/jju1s" target="_blank" rel="noopener noreferrer">Support on Ko-fi</a></footer>
  <script src="popup.js"></script>
</body>
</html>
